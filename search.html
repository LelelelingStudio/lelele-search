<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>搜索结果 - 了了了搜</title>
  <link rel="icon" type="image/png" href="https://search.leleleling.site/icon.png">
  <!-- 尽早应用主题，避免切换时闪烁 -->
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/common.css">
  <link rel="stylesheet" href="assets/search.css">
</head>
<body>
  <!-- 顶部搜索栏 -->
  <header class="search-header">
    <div class="header-inner">
      <a href="index.html" class="header-logo">了了了搜</a>
      <form class="header-search-form" action="search.html" method="GET">
        <input type="text" name="q" class="header-search-input" id="headerSearchInput" autocomplete="off">
        <button type="submit" class="header-search-btn" aria-label="搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
      <button class="theme-toggle" id="themeToggle" type="button"></button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="search-main">
    <!-- AI 总结区（最上方） -->
    <section class="summary-box hidden" id="summaryBox">
      <div class="summary-header">
        <span class="summary-badge">AI 总结</span>
        <span class="summary-engine" id="summaryEngine"></span>
      </div>
      <div class="summary-body" id="summaryBody"></div>
    </section>

    <!-- 词条卡片区 -->
    <section class="lexicon-section hidden" id="lexiconSection">
      <div class="lexicon-list" id="lexiconList"></div>
      <button class="lexicon-more-btn hidden" id="lexiconMoreBtn">查看更多相关词条</button>
    </section>

    <!-- 结果统计 & 信息 -->
    <div class="result-meta hidden" id="resultMeta"></div>

    <!-- 搜索结果列表 -->
    <ul class="result-list" id="resultList"></ul>

    <!-- 加载中 -->
    <div class="search-loading hidden" id="searchLoading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <span class="loading-text">正在搜索...</span>
    </div>

    <!-- 错误提示 -->
    <div class="search-error hidden" id="searchError"></div>

    <!-- 翻页 -->
    <div class="pagination hidden" id="pagination">
      <button class="page-btn" id="pagePrev">← 上一页</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="pageNext">下一页 →</button>
    </div>
  </main>

  <!-- 底部 -->
  <footer class="search-footer">
    <a href="https://leleleling.site/support.html" target="_blank" class="support-link">支持我们</a>
    <span class="sep">·</span>
    <a href="index.html" class="back-home">返回首页</a>
    <p class="copyright">© 2026 Leleleling Studio</p>
  </footer>

  <script src="assets/search-app.js"></script>
</body>
</html>
